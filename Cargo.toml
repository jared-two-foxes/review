[package]
name = "v0-determinism-tests"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-protocol = { path = "crates/agent-protocol" }
agent-kernel = { path = "crates/agent-kernel" }
review-app = { path = "crates/review-app" }
review-protocol = { path = "crates/review-protocol" }
serde_json = "1"

[workspace]
members = [
  "crates/agent-protocol",
  "crates/code-agent-runtime",
  "crates/review-protocol",
  "crates/review-app",
  "crates/review-cli",
  "crates/cli-common",
  "crates/agent-kernel", "crates/implement-app", "crates/implement-cli",
]
resolver = "2"
