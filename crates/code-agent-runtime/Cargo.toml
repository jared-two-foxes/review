[package]
name = "code-agent-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
git2 = "0.19"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
agent-kernel = { path = "../agent-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "blocking"] }

[dev-dependencies]
tempfile = "3"
agent-protocol = { path = "../agent-protocol" }
