[package]
name = "code-agent-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
git2 = "0.19"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
agent-kernel = { version = "0.1.0", path = "../agent-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "blocking"] }
tracing = "0.1"
ripgrep-api = "0.2"
regex = "1"
tempfile = "3"

[dev-dependencies]
agent-protocol = { version = "0.1.0", path = "../agent-protocol" }
tracing-subscriber = "0.3"
